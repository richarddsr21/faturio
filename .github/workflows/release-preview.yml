name: Release preview

# Em todo PR aberto contra `main`, mantém um comentário com a lista de
# PRs mesclados e issues resolvidas que vão para produção.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versão a partir do branch (release/vX.Y.Z)
        id: ver
        run: |
          ref="${{ github.head_ref }}"
          v="${ref#release/}"
          [[ "$v" == "$ref" ]] && v=""
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Gerar lista
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release/notes.sh \
            --base "${{ github.base_ref }}" \
            --head "${{ github.head_ref }}" \
            --version "${{ steps.ver.outputs.version }}" > notes.md
          cat notes.md

      - name: Publicar/atualizar comentário
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '<!-- release-preview -->\n' + fs.readFileSync('notes.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body.startsWith('<!-- release-preview -->'));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
